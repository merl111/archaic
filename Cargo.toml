[workspace]
members = ["crates/archaic-app", "crates/archaic-matrix", "crates/archaic-i18n"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
cui = "=0.2.0"
matrix-sdk = { version = "=0.19.1", default-features = false, features = ["e2e-encryption", "rustls-aws-lc-rs", "bundled-sqlite", "sso-login"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
url = "2"
fluent-bundle = "0.16"
unic-langid = "0.9"

[patch.crates-io]
cui = { path = "../cui/bindings/rust" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Keep local builds small: full Matrix SDK debug info and incremental copies
# otherwise accumulate tens of GiB across UI/test rebuilds.
[profile.dev]
debug = 1
incremental = false
