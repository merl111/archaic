[package]
name = "archaic-matrix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
matrix-sdk.workspace = true
tokio.workspace = true
url.workspace = true

serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime = "0.3"
futures-util = "0.3"
matrix-sdk-crypto = "=0.19.1"
matrix-sdk-store-encryption = "=0.19.1"
rusqlite = "0.40.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
chacha20poly1305 = "0.11"
getrandom = "0.4"
zeroize = "1"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[dev-dependencies]
wiremock = "0.6"
