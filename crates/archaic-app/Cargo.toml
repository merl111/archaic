[package]
name = "archaic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
url.workspace = true
cui.workspace = true
archaic-matrix = { path = "../archaic-matrix" }
archaic-i18n = { path = "../archaic-i18n" }
tokio.workspace = true
tempfile = "3"
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
subtle = "2"
ruma-html = "0.9"

tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
cpal = "0.18.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSObject", "NSAppleEventManager", "NSAppleEventDescriptor", "objc2-core-services"] }
