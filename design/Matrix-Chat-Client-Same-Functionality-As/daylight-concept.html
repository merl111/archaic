<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Concept B · Daylight — Matrix desktop client</title>
<style>
:root {
  --bg:      oklch(94% 0.035 235);
  --surface: oklch(99.5% 0.003 235);
  --fg:      oklch(22% 0.03 260);
  --muted:   oklch(50% 0.03 255);
  --border:  oklch(90% 0.015 240);
  --accent:  oklch(56% 0.21 22);
  --soft:    oklch(96.5% 0.012 240);
  --hover:   oklch(93.5% 0.018 240);
  --on-accent: oklch(99% 0.01 22);
  --accent-soft: color-mix(in oklch, var(--accent) 11%, var(--surface));
  --ok:      oklch(62% 0.15 155);
  --font-display: 'Avenir Next', 'Segoe UI Variable Display', 'Nunito Sans', system-ui, sans-serif;
  --font-body:    -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono:    ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--fg); outline-offset: 2px; border-radius: 8px; }
svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--font-mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }

.app { height: 100vh; min-width: 1100px; display: grid; grid-template-rows: 56px 1fr; gap: 0; padding: 0 12px 12px; }
.top { display: flex; align-items: center; gap: 16px; padding: 0 6px; }
.logo { font: 800 18px var(--font-display); letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
.logo i { width: 22px; height: 22px; border-radius: 7px; background: var(--fg); display: grid; place-items: center; }
.logo i::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--surface); }
.tabs { display: flex; gap: 4px; padding: 4px; background: color-mix(in oklch, var(--surface) 60%, transparent); border-radius: 14px; }
.tab { height: 34px; padding: 0 14px 0 6px; display: flex; align-items: center; gap: 8px; border-radius: 10px; font-weight: 600; font-size: 13px; color: var(--muted); }
.tab:hover { background: var(--surface); color: var(--fg); }
.tab.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px oklch(30% 0.05 250 / .12); }
.tab .g { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; font: 800 11px var(--font-display); color: oklch(20% 0.04 250); }
.tab .n { min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; background: var(--fg); color: var(--surface); font-size: 10.5px; line-height: 18px; text-align: center; }
.top .spacer { flex: 1; }
.me-btn { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 4px; border-radius: 18px; background: var(--surface); font-weight: 600; font-size: 13px; }
.me-btn:hover { background: var(--hover); }
.verify-chip { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 18px; background: var(--surface); color: var(--fg); font-weight: 600; font-size: 13px; box-shadow: inset 0 0 0 1.5px oklch(78% 0.14 75); }
.verify-chip:hover { background: oklch(96% 0.05 85); }
.verify-chip.done { box-shadow: inset 0 0 0 1.5px var(--ok); }

.work { display: grid; grid-template-columns: 300px 1fr 300px; gap: 12px; min-height: 0; }
.card { background: var(--surface); border-radius: 20px; box-shadow: 0 1px 2px oklch(30% 0.05 250 / .06), 0 8px 24px oklch(30% 0.05 250 / .06); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

/* room list */
.rl-head { padding: 18px 18px 10px; }
.rl-head h2 { margin: 0 0 12px; font: 800 22px var(--font-display); letter-spacing: -0.025em; }
.searchbox { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 12px; background: var(--soft); color: var(--muted); }
.searchbox:focus-within { box-shadow: inset 0 0 0 1.5px var(--fg); color: var(--fg); }
.searchbox input { flex: 1; border: 0; outline: 0; background: transparent; min-width: 0; }
.searchbox input::placeholder { color: var(--muted); }
.rl { flex: 1; overflow-y: auto; padding: 4px 10px 14px; }
.sec { font: 700 11px var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 14px 8px 6px; }
.room { width: 100%; display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 14px; text-align: left; }
.room:hover { background: var(--soft); }
.room.on { background: var(--fg); color: var(--surface); }
.room.on small { color: color-mix(in oklch, var(--surface) 72%, var(--fg)); }
.room .nm { flex: 1; min-width: 0; }
.room b { display: block; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.room small { display: block; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.room .side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.room .side .mono { color: var(--muted); }
.room.on .side .mono { color: color-mix(in oklch, var(--surface) 72%, var(--fg)); }
.cnt { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--hover); color: var(--fg); font: 700 11px/20px var(--font-body); text-align: center; }
.cnt.hl { background: var(--accent); color: var(--on-accent); }
.av { flex: none; width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; font: 800 15px var(--font-display); color: oklch(22% 0.04 250); position: relative; }
.av.round { border-radius: 50%; }
.av.sm { width: 28px; height: 28px; font-size: 11px; border-radius: 50%; }
.av .dot { position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; background: var(--ok); border: 2.5px solid var(--surface); }
.room.on .av .dot { border-color: var(--fg); }

/* chat */
.chat-head { display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 20px; border-bottom: 1px solid var(--border); }
.chat-head h1 { margin: 0; font: 800 18px var(--font-display); letter-spacing: -0.02em; }
.chat-head p { margin: 0; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-head .tt { flex: 1; min-width: 0; }
.ibtn { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--fg); }
.ibtn:hover { background: var(--hover); }
.ibtn.on { background: var(--fg); color: var(--surface); }
.stream { flex: 1; overflow-y: auto; padding: 18px 22px 8px; display: flex; flex-direction: column; gap: 2px; }
.day { align-self: center; margin: 12px 0; padding: 3px 12px; border-radius: 10px; background: var(--soft); color: var(--muted); font: 650 11.5px var(--font-body); }
.grp { display: flex; gap: 10px; align-items: flex-end; margin-top: 10px; max-width: 78%; }
.grp.me { align-self: flex-end; flex-direction: row-reverse; }
.grp .col { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.grp.me .col { align-items: flex-end; }
.sender { font-size: 12px; font-weight: 700; margin: 0 0 2px 12px; }
.bub { position: relative; padding: 9px 14px; border-radius: 18px; background: var(--soft); white-space: pre-wrap; overflow-wrap: anywhere; width: fit-content; max-width: 100%; }
.bub:hover { background: var(--hover); }
.grp:not(.me) .bub:last-of-type { border-bottom-left-radius: 6px; }
.grp.me .bub { background: var(--accent); color: var(--on-accent); }
.grp.me .bub:hover { background: oklch(50% 0.21 22); }
.grp.me .bub:last-of-type { border-bottom-right-radius: 6px; }
.bub .t { font: 10.5px var(--font-mono); opacity: .7; margin-left: 8px; }
.bub .rq { display: block; font-size: 12px; padding: 4px 10px; margin: 0 -4px 6px; border-radius: 10px; background: color-mix(in oklch, var(--fg) 7%, transparent); }
.grp.me .bub .rq { background: oklch(100% 0 0 / .18); }
.mention { font-weight: 700; padding: 0 5px; border-radius: 6px; background: oklch(88% 0.12 90); color: oklch(25% 0.05 80); }
.reacts { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
.react { height: 26px; padding: 0 9px; border-radius: 13px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); font-size: 13px; display: inline-flex; gap: 5px; align-items: center; }
.react:hover { background: var(--soft); }
.react.mine { box-shadow: inset 0 0 0 1.5px var(--fg); }
.react span { font: 700 11.5px var(--font-body); }
.quick { display: none; gap: 2px; padding: 2px; background: var(--surface); border-radius: 12px; box-shadow: 0 4px 14px oklch(30% 0.05 250 / .16); position: absolute; top: -18px; right: 6px; z-index: 2; }
.grp.me .quick { right: auto; left: 6px; }
.bub:hover .quick, .bub:focus-within .quick { display: flex; }
.quick button { width: 30px; height: 28px; border-radius: 9px; display: grid; place-items: center; color: var(--fg); font-size: 14px; }
.quick button:hover { background: var(--hover); }
.quick svg { width: 15px; height: 15px; }
.attach { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); color: var(--fg); margin-top: 6px; }
.attach .fi { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: oklch(86% 0.1 200); color: oklch(25% 0.05 220); }
.attach b { display: block; font-size: 13px; }
.attach small { color: var(--muted); }
.pollb { min-width: 320px; }
.pollb h4 { margin: 0 0 6px; font: 800 14px var(--font-display); }
.po { position: relative; display: flex; justify-content: space-between; width: 100%; padding: 8px 12px; margin-top: 6px; border-radius: 12px; background: var(--surface); text-align: left; overflow: hidden; box-shadow: inset 0 0 0 1px var(--border); }
.po:hover { box-shadow: inset 0 0 0 1.5px var(--fg); }
.po i { position: absolute; inset: 0 auto 0 0; background: oklch(88% 0.08 200); transition: width .35s; }
.po span { position: relative; }
.po.voted { box-shadow: inset 0 0 0 1.5px var(--fg); font-weight: 650; }
.pollb small { display: block; margin-top: 6px; color: var(--muted); font-size: 12px; }

.composer { margin: 8px 16px 16px; display: flex; align-items: flex-end; gap: 6px; padding: 6px; border-radius: 18px; background: var(--soft); }
.composer:focus-within { box-shadow: inset 0 0 0 1.5px var(--fg); }
.composer textarea { flex: 1; resize: none; border: 0; outline: 0; background: transparent; padding: 8px 6px; height: 38px; max-height: 140px; line-height: 1.5; }
.composer textarea::placeholder { color: var(--muted); }
.reply-bar { display: none; margin: 0 16px -4px; padding: 8px 8px 8px 14px; border-radius: 14px 14px 0 0; background: var(--hover); font-size: 12.5px; align-items: center; gap: 8px; color: var(--muted); }
.reply-bar.show { display: flex; }
.reply-bar b { color: var(--fg); }
.reply-bar .ibtn { width: 28px; height: 28px; margin-left: auto; }
.send { height: 38px; padding: 0 16px; border-radius: 13px; background: var(--accent); color: var(--on-accent); font-weight: 700; display: flex; align-items: center; gap: 6px; }
.send:hover:not(:disabled) { background: oklch(48% 0.21 22); }
.send:disabled { background: var(--hover); color: var(--muted); cursor: default; }

/* context */
.ctx-tabs { display: flex; gap: 4px; padding: 14px 14px 0; }
.ctx-tab { flex: 1; height: 34px; border-radius: 11px; font-weight: 650; font-size: 13px; color: var(--muted); }
.ctx-tab:hover { background: var(--soft); color: var(--fg); }
.ctx-tab.on { background: var(--soft); color: var(--fg); }
.ctx-body { flex: 1; overflow-y: auto; padding: 14px; }
.ctx-hero { text-align: center; padding: 8px 0 16px; }
.ctx-hero .av { width: 76px; height: 76px; border-radius: 24px; margin: 0 auto 10px; font-size: 28px; }
.ctx-hero h3 { margin: 0; font: 800 18px var(--font-display); letter-spacing: -0.02em; }
.ctx-hero p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.fact { padding: 12px; border-radius: 14px; background: var(--soft); }
.fact b { display: block; font: 800 18px var(--font-display); }
.fact small { color: var(--muted); font-size: 12px; }
.row-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 11px 12px; border-radius: 12px; font-weight: 600; }
.row-btn:hover { background: var(--soft); }
.row-btn small { color: var(--muted); font-weight: 500; }
.swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.sw { aspect-ratio: 1; border-radius: 12px; display: grid; place-items: end start; padding: 6px; font: 10px var(--font-mono); color: oklch(25% 0.04 250); }
.sw:hover { outline: 2px solid var(--fg); outline-offset: 1px; }
.mem { width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 12px; text-align: left; }
.mem:hover { background: var(--soft); }
.mem .nm { flex: 1; min-width: 0; }
.mem b { display: block; font-weight: 650; font-size: 13.5px; }
.mem small { display: block; font: 11px var(--font-mono); color: var(--muted); }
.lv { font: 700 10.5px var(--font-body); padding: 2px 8px; border-radius: 8px; background: var(--soft); color: var(--muted); }

/* verification modal */
.scrim { position: fixed; inset: 0; background: oklch(25% 0.04 250 / .35); backdrop-filter: blur(4px); display: none; place-items: center; z-index: 40; }
.scrim.show { display: grid; }
.modal { width: 520px; background: var(--surface); border-radius: 24px; padding: 28px; box-shadow: 0 30px 80px oklch(25% 0.05 250 / .3); }
.modal h2 { margin: 0 0 6px; font: 800 22px var(--font-display); letter-spacing: -0.02em; }
.modal p { margin: 0 0 18px; color: var(--muted); }
.emojis { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 20px; }
.emo { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 2px; border-radius: 14px; background: var(--soft); }
.emo span { font-size: 26px; line-height: 1; }
.emo small { font-size: 11px; color: var(--muted); font-weight: 600; }
.modal .acts { display: flex; justify-content: flex-end; gap: 8px; }
.btn2 { height: 42px; padding: 0 18px; border-radius: 13px; font-weight: 700; }
.btn2.ghost { background: var(--soft); }
.btn2.ghost:hover { background: var(--hover); }
.btn2.dark { background: var(--fg); color: var(--surface); }
.btn2.dark:hover { background: oklch(32% 0.03 260); }
.toast { position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 16px); opacity: 0; background: var(--fg); color: var(--surface); padding: 10px 16px; border-radius: 12px; font-weight: 650; font-size: 13px; transition: .2s; pointer-events: none; z-index: 50; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; border: 3px solid transparent; background-clip: padding-box; }
</style>
</head>
<body>
<div class="app" data-od-id="daylight-app">
  <header class="top" data-od-id="top-bar">
    <div class="logo"><i></i>Daylight</div>
    <nav class="tabs" id="tabs" data-od-id="space-tabs" aria-label="Spaces"></nav>
    <div class="spacer"></div>
    <button class="verify-chip" id="verifyChip" data-od-id="verify-session" onclick="openVerify()">
      <svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="M12 8v4M12 15.5v.01"/></svg><span>Verify this session</span>
    </button>
    <button class="me-btn" onclick="toast('Profile · Notifications · Appearance · Sessions')"><span class="av sm" id="meAv"></span>Mathias</button>
  </header>

  <div class="work">
    <aside class="card" data-od-id="room-list">
      <div class="rl-head">
        <h2 id="spaceTitle">Lumen Labs</h2>
        <label class="searchbox"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Filter rooms and people" aria-label="Filter rooms" /></label>
      </div>
      <div class="rl" id="rl"></div>
    </aside>

    <main class="card" data-od-id="chat">
      <div class="chat-head" data-od-id="chat-header">
        <div id="hAv"></div>
        <div class="tt"><h1 id="hName"></h1><p id="hSub"></p></div>
        <button class="ibtn" aria-label="Start call" onclick="toast('Starting an encrypted call…')"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg></button>
        <button class="ibtn" aria-label="Search in room" onclick="toast('Search this room')"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
        <button class="ibtn on" id="ctxBtn" aria-label="Toggle details" onclick="toggleCtx()"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg></button>
      </div>
      <div class="stream" id="stream" data-od-id="message-stream"></div>
      <div class="reply-bar" id="replyBar"></div>
      <div class="composer" data-od-id="composer">
        <button class="ibtn" aria-label="Attach" onclick="toast('Attach files, images or a voice message')"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <textarea id="input" rows="1" aria-label="Message" placeholder="Write a message"></textarea>
        <button class="ibtn" aria-label="Emoji" onclick="toast('Emoji picker')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14a4 4 0 0 0 7 0M9 9.5v.01M15 9.5v.01"/></svg></button>
        <button class="send" id="sendBtn" disabled onclick="send()">Send<svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
    </main>

    <aside class="card" id="ctx" data-od-id="context-panel">
      <div class="ctx-tabs" role="tablist">
        <button class="ctx-tab on" data-t="about" onclick="ctxTab('about')">About</button>
        <button class="ctx-tab" data-t="people" onclick="ctxTab('people')">People</button>
        <button class="ctx-tab" data-t="media" onclick="ctxTab('media')">Media</button>
      </div>
      <div class="ctx-body" id="ctxBody"></div>
    </aside>
  </div>
</div>

<div class="scrim" id="scrim" onclick="if(event.target===this)closeVerify()">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="vt" data-od-id="verify-dialog">
    <h2 id="vt">Compare emoji</h2>
    <p>Confirm the emoji below appear in the same order on your other device, signed in as @mathias:lumen.chat.</p>
    <div class="emojis" id="emojis"></div>
    <div class="acts"><button class="btn2 ghost" onclick="closeVerify();toast('Verification cancelled')">They don’t match</button><button class="btn2 dark" onclick="verified()">They match</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="shared/matrix-demo-data.js"></script>
<script src="shared/daylight.js"></script>
</body>
</html>
