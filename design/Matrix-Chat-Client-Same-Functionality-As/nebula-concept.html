<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Concept A · Nebula — Matrix desktop client</title>
<style>
:root {
  --bg:      oklch(17% 0.02 265);
  --surface: oklch(21% 0.022 265);
  --fg:      oklch(96% 0.008 265);
  --muted:   oklch(72% 0.02 265);
  --border:  oklch(29% 0.022 265);
  --accent:  oklch(84% 0.17 165);
  --rail:    oklch(13.5% 0.018 265);
  --raise:   oklch(25% 0.024 265);
  --hover:   oklch(28% 0.024 265);
  --accent-soft: color-mix(in oklch, var(--accent) 16%, transparent);
  --on-accent: oklch(20% 0.05 165);
  --danger:  oklch(64% 0.21 22);
  --ink:     oklch(18% 0.03 265);
  --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI Variable Display', system-ui, sans-serif;
  --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
  --font-mono:    ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--font-mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-rows: 38px 1fr; height: 100vh; min-width: 1100px; }
.titlebar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-left: 14px; background: var(--rail); border-bottom: 1px solid var(--border); }
.brand { font: 650 13px var(--font-display); display: flex; align-items: center; gap: 8px; }
.brand-dot { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); transform: rotate(45deg); }
.search-pill { width: 440px; height: 26px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 7px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); font-size: 12px; }
.search-pill:hover { background: var(--raise); color: var(--fg); }
.search-pill svg { width: 14px; height: 14px; }
.search-pill kbd { margin-left: auto; font: 10.5px var(--font-mono); padding: 1px 5px; border: 1px solid var(--border); border-radius: 4px; }
.winctl { display: flex; height: 100%; justify-self: end; }
.winctl button { width: 46px; display: grid; place-items: center; color: var(--muted); }
.winctl button:hover { background: var(--hover); color: var(--fg); }
.winctl button.close:hover { background: var(--danger); color: var(--fg); }
.winctl svg { width: 13px; height: 13px; }

.body { display: grid; grid-template-columns: 72px 280px 1fr auto; min-height: 0; }
.rail { background: var(--rail); display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 0; border-right: 1px solid var(--border); }
.space { position: relative; width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; font: 750 16px var(--font-display); color: var(--ink); transition: border-radius .18s, transform .1s; }
.space:hover { border-radius: 11px; }
.space:active { transform: scale(.95); }
.space.on::before { content: ''; position: absolute; left: -13px; width: 4px; height: 28px; border-radius: 0 4px 4px 0; background: var(--fg); }
.space .ub { position: absolute; right: -5px; bottom: -5px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--danger); color: var(--fg); font: 700 10px/15px var(--font-body); border: 2px solid var(--rail); }
.space.home { background: var(--raise); color: var(--fg); }
.rail .sep { width: 28px; height: 1px; background: var(--border); }
.rail .add { width: 46px; height: 46px; border-radius: 15px; border: 1.5px dashed var(--border); color: var(--muted); display: grid; place-items: center; }
.rail .add:hover { color: var(--fg); border-color: var(--muted); }
.rail .me { margin-top: auto; border-radius: 50%; }

.rooms { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.rooms-head { padding: 16px 12px 10px 16px; display: flex; align-items: center; justify-content: space-between; }
.rooms-head h2 { font: 700 18px var(--font-display); letter-spacing: -0.02em; margin: 0; }
.icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
.icon-btn:hover { background: var(--hover); color: var(--fg); }
.icon-btn.on { background: var(--raise); color: var(--fg); }
.filters { display: flex; gap: 6px; padding: 0 16px 10px; flex-wrap: wrap; }
.chip { height: 28px; padding: 0 11px; border-radius: 14px; border: 1px solid var(--border); color: var(--muted); font-size: 12px; }
.chip:hover { background: var(--hover); color: var(--fg); }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.room-scroll { overflow-y: auto; padding: 0 8px 12px; flex: 1; }
.group-label { font: 650 11px var(--font-body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: 14px 8px 6px; }
.room { width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 9px; text-align: left; }
.room:hover { background: var(--hover); }
.room.on { background: var(--raise); box-shadow: inset 0 0 0 1px var(--border); }
.room .nm { flex: 1; min-width: 0; }
.room .nm b { display: block; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.room .nm small { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.room.unread .nm b { font-weight: 700; }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--hover); color: var(--fg); font: 650 11px/20px var(--font-body); text-align: center; }
.badge.hl { background: var(--danger); }
.av { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 750 13px var(--font-display); color: var(--ink); position: relative; }
.av.sq { border-radius: 10px; }
.av.sm { width: 22px; height: 22px; font-size: 10px; }
.av.lg { width: 38px; height: 38px; font-size: 15px; }
.presence { position: absolute; right: -2px; bottom: -2px; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.room-head { height: 62px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 20px; border-bottom: 1px solid var(--border); }
.room-head h1 { font: 700 16px var(--font-display); letter-spacing: -0.015em; margin: 0; display: flex; align-items: center; gap: 8px; }
.room-head .topic { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.room-head .tt { flex: 1; min-width: 0; }
.e2ee { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 10px; background: var(--raise); color: var(--muted); font: 550 11px var(--font-body); }
.e2ee svg { width: 12px; height: 12px; }
.head-actions { display: flex; gap: 2px; }
.timeline { flex: 1; overflow-y: auto; padding: 16px 0 8px; }
.day { display: flex; align-items: center; gap: 12px; margin: 12px 20px; color: var(--muted); font: 550 11.5px var(--font-body); }
.day::before, .day::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.msg { position: relative; display: grid; grid-template-columns: 38px 1fr; gap: 12px; padding: 6px 20px; }
.msg:hover, .msg:focus-within { background: color-mix(in oklch, var(--fg) 4%, transparent); }
.msg.cont { padding-top: 0; }
.msg.cont > .av { visibility: hidden; height: 0; }
.msg.hlmsg { background: color-mix(in oklch, var(--accent) 7%, transparent); box-shadow: inset 2px 0 0 var(--accent); }
.who { display: flex; align-items: baseline; gap: 8px; }
.who b { font-weight: 650; }
.who .mono { color: var(--muted); }
.txt { margin: 1px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 72ch; }
.pill-mention { background: var(--raise); padding: 0 6px; border-radius: 6px; font-weight: 650; }
.reply-q { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; padding: 3px 10px; border-radius: 8px; background: var(--surface); width: fit-content; }
.reply-q b { color: var(--fg); font-weight: 600; }
.reacts { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.react { height: 26px; padding: 0 9px; border-radius: 13px; border: 1px solid var(--border); background: var(--surface); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.react:hover { background: var(--hover); }
.react.mine { border-color: var(--fg); background: var(--raise); }
.react span { font: 650 11.5px var(--font-body); }
.thread-sum { margin-top: 8px; display: flex; align-items: center; gap: 10px; padding: 7px 14px 7px 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); text-align: left; }
.thread-sum:hover { background: var(--hover); }
.stack-av { display: flex; }
.stack-av .av { margin-left: -6px; border: 2px solid var(--surface); }
.stack-av .av:first-child { margin-left: 0; }
.thread-sum b { font-weight: 650; font-size: 13px; }
.thread-sum small { display: block; color: var(--muted); font-size: 12px; }
.file-card { margin-top: 6px; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); width: 340px; }
.file-ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: oklch(78% 0.13 250); color: var(--ink); }
.file-card b { display: block; font-weight: 600; font-size: 13px; }
.file-card small { color: var(--muted); }
.poll { margin-top: 6px; width: 380px; padding: 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); }
.poll h4 { margin: 0 0 4px; font: 650 14px var(--font-display); }
.poll-opt { position: relative; width: 100%; display: flex; justify-content: space-between; padding: 8px 12px; margin-top: 6px; border-radius: 8px; border: 1px solid var(--border); text-align: left; overflow: hidden; }
.poll-opt i { position: absolute; inset: 0 auto 0 0; background: oklch(78% 0.13 250 / .22); transition: width .35s; }
.poll-opt:hover { background: var(--hover); }
.poll-opt.voted { border-color: oklch(78% 0.13 250); }
.poll-opt span { position: relative; }
.poll small { display: block; margin-top: 8px; color: var(--muted); font-size: 12px; }
.hover-bar { position: absolute; top: -14px; right: 20px; display: none; background: var(--raise); border: 1px solid var(--border); border-radius: 9px; padding: 2px; box-shadow: 0 8px 20px oklch(0% 0 0 / .35); z-index: 2; }
.msg:hover .hover-bar, .msg:focus-within .hover-bar { display: flex; }
.hover-bar button { width: 30px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: var(--muted); font-size: 14px; }
.hover-bar button:hover { background: var(--hover); color: var(--fg); }
.hover-bar svg { width: 16px; height: 16px; }
.typing { height: 22px; padding: 0 20px; color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%,60%,100% { opacity: .3 } 30% { opacity: 1 } }

.composer-wrap { padding: 0 20px 18px; }
.replying { display: none; align-items: center; gap: 8px; padding: 7px 8px 7px 12px; font-size: 12.5px; color: var(--muted); background: var(--raise); border: 1px solid var(--border); border-bottom: 0; border-radius: 12px 12px 0 0; }
.replying.show { display: flex; }
.replying b { color: var(--fg); }
.replying .icon-btn { margin-left: auto; width: 26px; height: 26px; }
.composer { display: flex; align-items: flex-end; gap: 4px; padding: 7px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); }
.replying.show + .composer { border-radius: 0 0 14px 14px; }
.composer:focus-within { border-color: color-mix(in oklch, var(--fg) 30%, var(--border)); }
.composer textarea { flex: 1; resize: none; border: 0; outline: 0; background: transparent; padding: 6px 6px; max-height: 140px; height: 32px; line-height: 1.45; }
.composer textarea::placeholder { color: var(--muted); }
.send { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); }
.send:hover:not(:disabled) { background: oklch(90% 0.15 165); }
.send:disabled { opacity: .35; cursor: default; }

.panel { width: 340px; border-left: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.panel.hide { display: none; }
.panel-head { height: 62px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 18px; border-bottom: 1px solid var(--border); }
.panel-head h3 { margin: 0; font: 700 15px var(--font-display); flex: 1; }
.panel-body { overflow-y: auto; flex: 1; padding: 6px 0; }
.panel .msg { grid-template-columns: 30px 1fr; padding: 8px 18px; }
.panel .msg .av { width: 30px; height: 30px; font-size: 12px; }
.thread-root { border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 4px; }
.member { display: flex; align-items: center; gap: 10px; padding: 7px 18px; width: 100%; text-align: left; }
.member:hover { background: var(--hover); }
.member .nm { flex: 1; min-width: 0; }
.member .nm b { display: block; font-weight: 550; }
.member .nm small { display: block; color: var(--muted); font: 11px var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl { font: 650 10.5px var(--font-body); padding: 2px 7px; border-radius: 6px; background: var(--raise); color: var(--muted); }
.info-hero { text-align: center; padding: 22px 18px 18px; border-bottom: 1px solid var(--border); }
.info-hero .av { margin: 0 auto 12px; width: 72px; height: 72px; font-size: 26px; border-radius: 22px; }
.info-hero h4 { margin: 0; font: 700 18px var(--font-display); letter-spacing: -0.02em; }
.info-hero p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
.info-row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 18px; text-align: left; }
.info-row:hover { background: var(--hover); }
.info-row span { flex: 1; }
.info-row small { color: var(--muted); }
.panel .composer { margin: 10px 14px 14px; }

.call { position: fixed; right: 24px; bottom: 100px; width: 310px; border-radius: 16px; background: var(--rail); border: 1px solid var(--border); box-shadow: 0 24px 60px oklch(0% 0 0 / .5); padding: 14px; display: none; z-index: 20; }
.call.show { display: block; }
.call-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 12.5px; }
.call-top b { font-weight: 650; }
.call-top .mono { color: var(--muted); }
.call-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { aspect-ratio: 4/3; border-radius: 10px; display: grid; place-items: center; position: relative; }
.tile .av { width: 40px; height: 40px; background: oklch(100% 0 0 / .55); }
.tile small { position: absolute; left: 8px; bottom: 5px; font-size: 11px; font-weight: 650; color: var(--ink); }
.tile.speaking { box-shadow: 0 0 0 2px var(--rail), 0 0 0 4px var(--accent); }
.call-bar { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
.call-bar button { width: 44px; height: 44px; border-radius: 50%; background: var(--raise); display: grid; place-items: center; }
.call-bar button:hover { background: var(--hover); }
.call-bar button.off { background: var(--fg); color: var(--bg); }
.call-bar .hang { background: var(--danger); color: var(--fg); }
.call-bar .hang:hover { background: oklch(56% 0.21 22); }

.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 16px); opacity: 0; background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-weight: 600; font-size: 13px; transition: .2s; pointer-events: none; z-index: 30; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; border: 3px solid transparent; background-clip: padding-box; }
</style>
</head>
<body>
<div class="app" data-od-id="nebula-app">
  <header class="titlebar" data-od-id="titlebar">
    <div class="brand"><span class="brand-dot"></span>Nebula</div>
    <button class="search-pill" data-od-id="global-search" onclick="toast('Search rooms, people and messages')">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Search rooms, people, messages<kbd>Ctrl K</kbd>
    </button>
    <div class="winctl">
      <button aria-label="Minimize"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button aria-label="Maximize"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/></svg></button>
      <button class="close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
  </header>

  <div class="body">
    <nav class="rail" id="rail" data-od-id="spaces-rail" aria-label="Spaces"></nav>

    <aside class="rooms" data-od-id="room-list">
      <div class="rooms-head">
        <h2 id="spaceName">Home</h2>
        <button class="icon-btn" aria-label="Start chat" onclick="toast('Start a chat, create or join a room')"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div class="filters" id="filters" data-od-id="room-filters"></div>
      <div class="room-scroll" id="roomList"></div>
    </aside>

    <main class="main" data-od-id="timeline-pane">
      <div class="room-head" data-od-id="room-header">
        <div id="headAv"></div>
        <div class="tt"><h1 id="headName"></h1><div class="topic" id="headTopic"></div></div>
        <div class="head-actions">
          <button class="icon-btn" aria-label="Voice call" onclick="startCall()"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></button>
          <button class="icon-btn" aria-label="Video call" onclick="startCall()"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg></button>
          <button class="icon-btn" id="btn-threads" aria-label="Threads" onclick="setPanel('threads')"><svg viewBox="0 0 24 24"><path d="M4 5h16v10H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg></button>
          <button class="icon-btn" id="btn-members" aria-label="Members" onclick="setPanel('members')"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/></svg></button>
          <button class="icon-btn" id="btn-info" aria-label="Room info" onclick="setPanel('info')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg></button>
        </div>
      </div>
      <div class="timeline" id="timeline" data-od-id="timeline"></div>
      <div class="typing" id="typing"></div>
      <div class="composer-wrap" data-od-id="composer">
        <div class="replying" id="replying"></div>
        <div class="composer">
          <button class="icon-btn" aria-label="Attach file" onclick="toast('Files are encrypted before upload')"><svg viewBox="0 0 24 24"><path d="M21 11.5 12.5 20a5 5 0 0 1-7-7L14 4.5a3.3 3.3 0 0 1 4.7 4.7L10.2 17.7a1.7 1.7 0 0 1-2.4-2.4L15.5 7.6"/></svg></button>
          <textarea id="input" rows="1" placeholder="Send an encrypted message…" aria-label="Message"></textarea>
          <button class="icon-btn" aria-label="Create poll" onclick="toast('Create a poll')"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></button>
          <button class="icon-btn" aria-label="Emoji" onclick="toast('Emoji and sticker picker')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14a4 4 0 0 0 7 0M9 9.5v.01M15 9.5v.01"/></svg></button>
          <button class="send" id="sendBtn" aria-label="Send" disabled onclick="send()"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
      </div>
    </main>

    <aside class="panel" id="panel" data-od-id="right-panel">
      <div class="panel-head"><h3 id="panelTitle"></h3>
        <button class="icon-btn" aria-label="Close panel" onclick="setPanel(null)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="panel-body" id="panelBody"></div>
      <div id="panelFoot"></div>
    </aside>
  </div>
</div>

<div class="call" id="call" data-od-id="call-pip">
  <div class="call-top"><b id="callRoom"></b><span class="mono" id="callTime">00:00</span></div>
  <div class="call-grid" id="callGrid"></div>
  <div class="call-bar">
    <button aria-label="Mute" onclick="this.classList.toggle('off')"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
