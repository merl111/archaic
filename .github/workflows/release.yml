name: Windows application visual review
on: [workflow_dispatch]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Download the validated application build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38594472880 --repo merl111/archaic --name release-windows-2022 --dir download
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive (Get-ChildItem download/*.zip | Select-Object -First 1).FullName unpacked
      - name: Install Windows App Runtime 1.8
        run: |
          Invoke-WebRequest 'https://aka.ms/windowsappsdk/1.8/1.8.260921001/windowsappruntimeinstall-x64.exe' -OutFile "$env:RUNNER_TEMP/runtime.exe"
          $p = Start-Process "$env:RUNNER_TEMP/runtime.exe" -ArgumentList '--quiet' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Runtime installer: $($p.ExitCode)" }
      - name: Capture settings and focused composer
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          New-Item evidence -ItemType Directory
          $app = (Get-ChildItem unpacked -Directory | Select-Object -First 1).FullName
          & tools/capture_windows_ui.ps1 -Directory $app -Prefix "$PWD/evidence/settings-light"
          & tools/capture_windows_ui.ps1 -Directory $app -Prefix "$PWD/evidence/settings-dark" -Theme dark
          & tools/capture_windows_ui.ps1 -Directory $app -Prefix "$PWD/evidence/draft-light" -Draft
          & tools/capture_windows_ui.ps1 -Directory $app -Prefix "$PWD/evidence/draft-dark" -Theme dark -Draft
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-app-interaction-captures
          path: evidence/
