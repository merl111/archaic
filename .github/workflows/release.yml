name: Publish verified macOS preview
on: [workflow_dispatch]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the verified native application run
        run: |
          test "$(gh run view 38604915778 --json conclusion --jq .conclusion)" = success
          gh run download 38604915778 --name release-macos-14 --dir download
      - name: Verify native package provenance and hashes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil, zipfile
          package = next(Path('download').glob('*.zip'))
          with zipfile.ZipFile(package) as archive:
              metadata = json.loads(archive.read(next(n for n in archive.namelist() if n.endswith('/build.json'))))
              assert metadata['source_revision'] == '40f04339ed66fd1f5a14f7981049603f340259d4'
              assert metadata['cui_revision'] == '305d4b398672495e0ff88b7e3184bc0e51b8b050'
              assert metadata['target_os'] == 'Darwin' and metadata['architecture'] == 'arm64'
              binary = archive.read(next(n for n in archive.namelist() if n.endswith('/Archaic.app/Contents/MacOS/archaic')))
              assert hashlib.sha256(binary).hexdigest() == metadata['binary_sha256']
          print(json.dumps(metadata, indent=2))
          target = Path('archaic-0.1.0-macos.1-arm64.zip')
          shutil.copyfile(package, target)
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          target.with_suffix('.zip.sha256').write_text(digest + '  ' + target.name + '\n')
          print('Archive SHA256:', digest)
          PY
      - name: Publish the reviewed native build
        run: |
          gh release create v0.1.0-macos.1 archaic-0.1.0-macos.1-arm64.zip archaic-0.1.0-macos.1-arm64.zip.sha256 \
            --target 40f04339ed66fd1f5a14f7981049603f340259d4 \
            --title 'Archaic 0.1.0 — macOS Apple Silicon preview' \
            --notes-file docs/MACOS-PREVIEW-RELEASE.md --prerelease
